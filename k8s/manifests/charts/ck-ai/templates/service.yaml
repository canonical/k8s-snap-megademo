apiVersion: v1
kind: Service
metadata:
  name: {{ include "ck-ai.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ck-ai.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: gateway
      protocol: TCP
      name: gateway
  selector:
    {{- include "ck-ai.selectorLabels" . | nindent 4 }}
